<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="welcome-screen">
        <form id="begin-game">
            <h2>WANTED</h2>
            <p>Dead or Alive</p>
            <hr>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required>
            <label for="difficulty">Reward</label>
            <select name="difficulty" id="difficulty" required>
                <option value="1">$250</option>
                <option value="2">$500</option>
                <option value="3">$1,000</option>
            </select>
            <input type="submit" value="take the job" id="play-btn">
        </form>
    </div>
    <div id="gamescreen" class="invisible">
        <div id="hangman-area"></div>
        <div id="letters-area">
        </div>
        <button id="check-answer" class="invisible">Check</button>
    </div>
</body>
</html>
